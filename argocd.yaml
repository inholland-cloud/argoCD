apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: simple-slideshow-test
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: paas-group3-showcase
  project: default
  source:
    path: overlays/test/
    repoURL: https://github.com/inholland-cloud/fotoshow-deploy.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
